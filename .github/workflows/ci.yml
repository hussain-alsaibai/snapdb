name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - name: ruff check
        run: ruff check .

  test:
    name: Test (Linux, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (zero runtime deps; numpy only for interop tests)
        run: pip install -e ".[dev,numpy]"
      - name: Unit tests (pytest)
        run: pytest tests/ -q
      - name: Script-style suites
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/test_delta_encoding.py
          python tests/test_dict_encoding.py
          python tests/test_schema_fast.py
          python tests/test_snapdb.py

  test-windows:
    name: Test (Windows, py3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,numpy]"
      - name: Windows-safe suites (handles released before file cleanup)
        run: pytest tests/test_optimizations.py tests/test_features.py tests/test_v02.py -q

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[numpy]" pandas
      - name: Run benchmark suite
        run: |
          python benchmarks/bench_suite.py --rows 50000 --read-ops 10000 --repeat 3 \
            --json bench.json --markdown bench.md
      - name: Publish to job summary
        run: |
          echo "## SnapDB benchmark" >> "$GITHUB_STEP_SUMMARY"
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench.json
            bench.md
