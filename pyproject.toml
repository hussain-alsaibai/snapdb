[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysnapdb"
version = "0.14.0"
description = "Extremely Lightweight Lightning-Fast In-Memory Database for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "H. A. Alsaibai", email = "hussain.alsaibai@gmail.com"},
]
keywords = ["database", "in-memory", "embedded", "columnar", "mmap", "zero-copy", "pure-python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/snapdb"
Repository = "https://github.com/hussain-alsaibai/snapdb"
Issues = "https://github.com/hussain-alsaibai/snapdb/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["snapdb*"]
exclude = ["tests*", "benchmarks*"]

[project.optional-dependencies]
# Dev/CI only — the runtime stays zero-dependency.
dev = ["pytest>=7", "ruff>=0.4"]
numpy = ["numpy>=1.21"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pyflakes (F) + a pragmatic slice of pycodestyle (E/W). Keep the runtime lean
# and the lint signal high without bikeshedding on every stylistic nit.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length is handled by the formatter, not enforced hard
    "E741",  # ambiguous names (e.g. single-letter loop vars) are fine here
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E402"]
"tests/*" = ["E402", "F841", "E712"]
